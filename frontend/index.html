<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2fa" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131218" />
  <script>
    // 主题早加载：在 CSS 应用前确定 data-theme，避免深色用户首帧闪白
    // 值域：light / dark / auto（默认，跟随系统）
    (function () {
      try {
        var t = localStorage.getItem('yantu-theme') || 'auto'
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      } catch (e) { /* 忽略隐私模式下的 localStorage 异常 */ }
    })()
  </script>
  <meta name="format-detection" content="telephone=no" />
  <title>MyResearcher · 数字科研导师</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #app { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      font-size: 15px; line-height: 1.55; letter-spacing: -0.01em;
      background: #f4f2fa;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
    }
    html[data-theme="dark"] body { background: #131218; }
    #app { display: flex; flex-direction: column; min-height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
